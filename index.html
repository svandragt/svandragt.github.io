<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>svandragt — Projects</title>
  <meta name="description" content="Browse the web projects of Sander van Dragt.">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b0b0f'/><text x='16' y='24' font-family='Arial Black,Arial' font-weight='900' font-size='22' text-anchor='middle' fill='%23e6262e'>S</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav" id="nav">
    <a class="brand" href="./" aria-label="svandragt home">SVANDRAGT</a>
    <label class="search" id="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search projects" autocomplete="off" aria-label="Search projects">
    </label>
  </header>

  <main>
    <section class="hero" id="hero" aria-label="Featured project"></section>
    <div id="rows" class="rows"></div>
    <section id="results" class="results" hidden aria-live="polite"></section>
  </main>

  <footer class="foot">
    <a href="https://github.com/svandragt">github.com/svandragt</a>
    <span id="generated"></span>
  </footer>

  <dialog id="detail" class="detail" aria-labelledby="d-title">
    <div class="detail-media">
      <img id="d-img" alt="">
      <button class="close" id="d-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="detail-head">
        <h2 id="d-title"></h2>
        <div class="actions">
          <a id="d-visit" class="btn primary" href="#">
            <svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>Visit
          </a>
          <a id="d-source" class="btn ghost" href="#" target="_blank" rel="noopener">Source</a>
        </div>
      </div>
    </div>
    <div class="detail-body">
      <p class="meta" id="d-meta"></p>
      <p id="d-desc"></p>
      <ul class="tags" id="d-tags"></ul>
    </div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
